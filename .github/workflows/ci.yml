name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm run lint
      - run: mise exec -- pnpm run check
      - run: mise exec -- pnpm run build
